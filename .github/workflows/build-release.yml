name: Build & Release APK

on:
  # Push a tag like v0.1.3 (e.g. from a PC) to build and release it.
  push:
    tags:
      - "v*"
  # Trigger from anywhere -- including the GitHub mobile app's Actions tab --
  # with no PC required. Give it a version to bump/tag/release; leave it
  # blank to just build the current commit and check it compiles.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.3 (blank = just build, no tag/release)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bump version, commit, and tag
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          version="${{ inputs.version }}+${{ github.run_number }}"
          sed -i "s/^version: .*/version: $version/" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Bump version to $version"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ inputs.version }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        id: apk
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          name="Stackline-${tag:-dev-${{ github.run_number }}}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$name"
          echo "path=build/app/outputs/flutter-apk/$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackline-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Stackline ${{ steps.release_tag.outputs.tag }}"
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
